<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bill Estimation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .bill-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            position: relative;
            height: 40px;
        }
        .bill-header img {
            cursor: pointer;
        }
        .bill-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            height: 32px;
        }
        .bill-back {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            cursor: pointer;
        }
        .bill-estimation-main {
            max-width: 420px;
            margin: 0 auto;
            padding: 0 16px 80px 16px;
        }
        .bill-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 16px 0;
        }
        .bill-form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .bill-form-row select, .bill-form-row input {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }
        .bill-location-row {
            margin-bottom: 16px;
        }
        .bill-location-row select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }
        .bill-summary-box {
            background: #fff;
            border-radius: 16px;
            padding: 20px 16px 12px 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            border: 2px solid #eee;
        }
        .bill-summary-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.1rem;
        }
        .bill-summary-table td {
            padding: 6px 0;
        }
        .bill-summary-table tr:not(:last-child) td {
            border-bottom: 1px solid #eee;
        }
        .bill-summary-table .total {
            font-weight: bold;
            font-size: 1.15rem;
        }
        .bill-print-btn {
            width: 100%;
            padding: 14px 0;
            background: #7ED957;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 16px;
            transition: background 0.2s;
        }
        .bill-print-btn:active {
            background: #6bc24e;
        }
        /* Confirmation Dialog */
        .bill-dialog-backdrop {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.18);
            justify-content: center;
            align-items: center;
        }
        .bill-dialog-backdrop.active {
            display: flex;
        }
        .bill-dialog {
            background: #fff;
            border-radius: 20px;
            padding: 32px 24px 28px 24px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.10);
            text-align: center;
            min-width: 260px;
            max-width: 90vw;
        }
        .bill-dialog .dialog-title {
            color: #7ED957;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .bill-dialog .dialog-check {
            font-size: 4rem;
            color: #7ED957;
            margin: 16px 0 12px 0;
            display: inline-block;
        }
        .bill-dialog .dialog-desc {
            color: #222;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="top-bar"></div>
    </header>
    <main class="bill-estimation-main">
        <div class="bill-header">
            <img class="bill-back" src="assets/back.png" alt="Back" onclick="window.history.back()" />
            <img class="bill-logo" src="assets/logo.png" alt="Setrum Logo">
        </div>
        <div class="bill-title">Bill Estimation</div>
        <div class="bill-form-row">
            <select id="from-date">
                <option>1 January 1970</option>
            </select>
            <select id="until-date">
                <option>31 January 1970</option>
            </select>
        </div>
        <div class="bill-location-row">
            <select id="location">
                <option>Tangerang, Indonesia</option>
            </select>
        </div>
        <div class="bill-summary-box">
            <table class="bill-summary-table">
                <tr>
                    <td>kWh Usage</td>
                    <td style="text-align:right;">1,610</td>
                </tr>
                <tr>
                    <td>Rates/kWh</td>
                    <td style="text-align:right;">Rp 1,445</td>
                </tr>
                <tr>
                    <td>Usage Fee</td>
                    <td style="text-align:right;">Rp 2,326,450</td>
                </tr>
                <tr>
                    <td>Tax (3% Usage fee)</td>
                    <td style="text-align:right;">Rp 69,794</td>
                </tr>
                <tr>
                    <td>Stamp</td>
                    <td style="text-align:right;">Rp 3,000</td>
                </tr>
                <tr>
                    <td class="total">Bill Estimation</td>
                    <td class="total" style="text-align:right;">Rp 2,399,244</td>
                </tr>
            </table>
        </div>
        <button class="bill-print-btn" id="print-btn">Get Printable Summary</button>
    </main>
    <!-- Confirmation Dialog -->
    <div class="bill-dialog-backdrop" id="dialog-backdrop">
        <div class="bill-dialog">
            <div class="dialog-title">Saved !</div>
            <div class="dialog-check">&#10003;</div>
            <div class="dialog-desc">check your downloads folder</div>
        </div>
    </div>
    <nav class="bottom-nav">
        <a href="index.html"><button><img src="assets/home.svg" alt="Home"/><span>Home</span></button></a>
        <button class="active"><img src="assets/estimation.svg" alt="Bill Estimation"/><span>Bill Estimation</span></button>
        <a href="notification.html"><button><img src="assets/notif.svg" alt="Notification"/><span>Notification</span></button></a>
        <a href="profile.html"><button><img src="assets/user.png" alt="Profile"/><span>Username</span></button></a>
    </nav>
    <script>
        // Show dialog on print button click
        document.getElementById('print-btn').onclick = function() {
            document.getElementById('dialog-backdrop').classList.add('active');
            setTimeout(() => {
                document.getElementById('dialog-backdrop').classList.remove('active');
            }, 2000); // Hide after 2 seconds
        };
    </script>
</body>
</html>
